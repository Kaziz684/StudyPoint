name: Build & Release APK

# Har master push par: version bump -> SIGNED release APK -> GitHub Release.
# Signing keystore + passwords GitHub Secrets mein hain — repo mein koi
# key ya password commit NAHI hota (repo public hai).
# app/build.gradle.kts KEYSTORE_FILE env var se keystore uthata hai.
# Version-bump commits khud "[skip ci]" ke sath push hote hain taake loop na bane.

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Restore keystore from secret
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret missing — repo Settings > Secrets and variables > Actions mein add karein"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          ls -lh "$RUNNER_TEMP/release.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Bump versionCode
        id: bump
        run: |
          FILE=app/build.gradle.kts
          CODE=$(grep -oP 'versionCode = \K\d+' "$FILE" | head -1)
          NEW=$((CODE + 1))
          sed -i -E "s/versionCode = $CODE/versionCode = $NEW/" "$FILE"
          VNAME=$(grep -oP 'versionName = "\K[^"]+' "$FILE" | head -1)
          echo "version_code=$NEW" >> "$GITHUB_OUTPUT"
          echo "version_name=$VNAME" >> "$GITHUB_OUTPUT"
          echo "tag=v${VNAME}-${NEW}" >> "$GITHUB_OUTPUT"
          echo "Bumped versionCode $CODE -> $NEW"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          NEWNAME="StudyPoint-${{ steps.bump.outputs.tag }}.apk"
          cp "$APK" "app/build/outputs/apk/release/$NEWNAME"
          echo "apk_path=app/build/outputs/apk/release/$NEWNAME" >> "$GITHUB_ENV"
          ls -lh "app/build/outputs/apk/release/$NEWNAME"

      - name: Commit version bump [skip ci]
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts
          git commit -m "bump versionCode to ${{ steps.bump.outputs.version_code }} [skip ci]"
          git push

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES="$(git log -1 --pretty=%B | head -20)"
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "StudyPoint ${{ steps.bump.outputs.tag }}" \
            --notes "$NOTES" \
            "${{ env.apk_path }}"