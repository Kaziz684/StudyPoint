<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Ambient Glows -->
  <circle cx="200" cy="150" r="250" fill="#4f46e5" opacity="0.25" filter="url(#glow)" />
  <circle cx="950" cy="350" r="300" fill="#06b6d4" opacity="0.2" filter="url(#glow)" />
  <circle cx="600" cy="500" r="200" fill="#10b981" opacity="0.15" filter="url(#glow)" />

  <!-- Top Logo & Brand -->
  <g transform="translate(80, 70)">
    <rect width="64" height="64" rx="16" fill="url(#accentGrad)" />
    <path d="M32 16L12 26L32 36L52 26L32 16Z" fill="#ffffff" />
    <path d="M20 31.5V42C20 45 25.4 48 32 48C38.6 48 44 45 44 42V31.5L32 37.5L20 31.5Z" fill="#e0e7ff" />
    <text x="82" y="44" font-family="-apple-system, Inter, sans-serif" font-size="36" font-weight="900" fill="#ffffff" letter-spacing="-0.5">StudyPoint</text>
    <rect x="290" y="16" width="130" height="32" rx="16" fill="rgba(79, 70, 229, 0.3)" stroke="rgba(99, 102, 241, 0.5)" stroke-width="1.5" />
    <text x="355" y="38" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="700" fill="#a5b4fc" text-anchor="middle">PCTB EDITION</text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="220" font-family="-apple-system, Inter, sans-serif" font-size="54" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Punjab Board Notes,
  </text>
  <text x="80" y="285" font-family="-apple-system, Inter, sans-serif" font-size="54" font-weight="800" fill="url(#textGrad)" letter-spacing="-1">
    Past Papers &amp; AI Tutor
  </text>

  <!-- Subheadline -->
  <text x="80" y="345" font-family="-apple-system, Inter, sans-serif" font-size="22" font-weight="400" fill="#94a3b8">
    Classes 9, 10, 11 &amp; 12 • Physics, Chemistry, Math, Tarjuma-tul-Quran &amp; Pak Studies
  </text>

  <!-- Badges Grid -->
  <g transform="translate(80, 395)">
    <!-- Badge 1 -->
    <rect width="180" height="48" rx="12" fill="rgba(16, 185, 129, 0.15)" stroke="rgba(16, 185, 129, 0.4)" />
    <text x="90" y="30" font-family="-apple-system, Inter, sans-serif" font-size="16" font-weight="700" fill="#6ee7b7" text-anchor="middle">✓ 100% Free Notes</text>

    <!-- Badge 2 -->
    <rect x="195" width="220" height="48" rx="12" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.4)" />
    <text x="305" y="30" font-family="-apple-system, Inter, sans-serif" font-size="16" font-weight="700" fill="#67e8f9" text-anchor="middle">✓ Past Papers 2022-26</text>

    <!-- Badge 3 -->
    <rect x="430" width="190" height="48" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.4)" />
    <text x="525" y="30" font-family="-apple-system, Inter, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle">★ 4.9 Star Rating</text>
  </g>

  <!-- Download APK Button Mock -->
  <g transform="translate(80, 480)">
    <rect width="360" height="68" rx="18" fill="url(#accentGrad)" filter="url(#shadow)" />
    <path d="M40 34L40 44M40 44L32 36M40 44L48 36M26 48L54 48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="75" y="42" font-family="-apple-system, Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Download StudyPoint APK</text>
    <text x="75" y="58" font-family="-apple-system, Inter, sans-serif" font-size="12" font-weight="500" fill="#c7d2fe">v2.4.0 (18 MB) • For Android Devices</text>
  </g>

  <!-- Right Side App Illustration Phone -->
  <g transform="translate(780, 80)">
    <!-- Phone Body -->
    <rect width="320" height="480" rx="36" fill="#0f172a" stroke="#334155" stroke-width="6" />
    <!-- Screen Header -->
    <rect x="18" y="24" width="284" height="60" rx="14" fill="#1e293b" />
    <text x="40" y="60" font-family="-apple-system, Inter, sans-serif" font-size="18" font-weight="800" fill="#ffffff">StudyPoint</text>
    <rect x="230" y="44" width="56" height="22" rx="11" fill="#4f46e5" />
    <text x="258" y="59" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">AI ON</text>
    <!-- Cards inside phone -->
    <rect x="18" y="100" width="134" height="100" rx="12" fill="rgba(79, 70, 229, 0.25)" stroke="rgba(99, 102, 241, 0.4)" />
    <text x="32" y="135" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Class 9th</text>
    <text x="32" y="155" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#94a3b8">Islamiyat &amp; Quran</text>
    <text x="32" y="180" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="600" fill="#10b981">● 8 Subjects</text>

    <rect x="168" y="100" width="134" height="100" rx="12" fill="rgba(6, 182, 212, 0.25)" stroke="rgba(6, 182, 212, 0.4)" />
    <text x="182" y="135" font-family="-apple-system, Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Class 10th</text>
    <text x="182" y="155" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#94a3b8">Pak Studies &amp; Quran</text>
    <text x="182" y="180" font-family="-apple-system, Inter, sans-serif" font-size="10" font-weight="600" fill="#38bdf8">● 8 Subjects</text>

    <!-- Quiz Banner in Phone -->
    <rect x="18" y="216" width="284" height="100" rx="14" fill="linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(6, 182, 212, 0.2) 100%)" stroke="rgba(16, 185, 129, 0.4)" />
    <text x="36" y="250" font-family="-apple-system, Inter, sans-serif" font-size="16" font-weight="800" fill="#6ee7b7">MCQs Test Engine</text>
    <text x="36" y="275" font-family="-apple-system, Inter, sans-serif" font-size="12" fill="#cbd5e1">Practice 10,000+ Past MCQs</text>
    <text x="36" y="295" font-family="-apple-system, Inter, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">Instant Result &amp; Analysis →</text>

    <!-- Material Icons Bar -->
    <rect x="18" y="330" width="284" height="120" rx="14" fill="#1e293b" />
    <text x="36" y="360" font-family="-apple-system, Inter, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Curriculum Resources</text>
    <text x="36" y="388" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#94a3b8">📖 Textbooks</text>
    <text x="160" y="388" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#94a3b8">📝 Solved Notes</text>
    <text x="36" y="420" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#94a3b8">📄 Past Papers</text>
    <text x="160" y="420" font-family="-apple-system, Inter, sans-serif" font-size="11" fill="#94a3b8">⚡ AI Tutor</text>
  </g>
</svg>
