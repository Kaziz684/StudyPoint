# JVM arguments for Gradle Daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle in parallel mode (faster builds if modules are independent)
# org.gradle.parallel=true

# AndroidX package support
android.useAndroidX=true
android.enableJetifier=true

# Kotlin code style
kotlin.code.style=official

# Optimize R class (namespacing for faster builds)
android.nonTransitiveRClass=true

# Enable configuration cache (improves build speed in newer Gradle versions)
org.gradle.configuration-cache=true

# Enable build caching (avoids re-compilation of unchanged modules)
org.gradle.caching=true
org.gradle.unsafe.configuration-cache=false

